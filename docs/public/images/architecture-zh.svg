<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1360" viewBox="0 0 1280 1360" role="img" aria-labelledby="title desc" xml:lang="en-US">
<title id="title">FaultDeck · 系统架构</title>
<desc id="desc">FaultDeck 架构：faultdeck CLI 通过换行分隔的 JSON 行向 faultdeck-coordinator 协调中枢（默认 127.0.0.1:7001）发送指令；中枢维护 agent 注册表与路由并归档运行报告；每台目标主机上的 faultdeck-agent 以 token 鉴权，经 faultdeck-core 校验后驱动 faultdeck-netem tc 适配器（根 qdisc 100: 实现延迟与丢包），断线故障则通过 iptables mangle DROP 实现；faultdeck-report 产出 JSON/HTML 运行报告，含 SHA-256 场景哈希与 compare_runs 历史对比。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker><marker id="arrow-087f5b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f5b"/></marker><marker id="arrow-475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#475569"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7c3aed"/></marker><marker id="arrow-c2410c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#c2410c"/></marker></defs>
