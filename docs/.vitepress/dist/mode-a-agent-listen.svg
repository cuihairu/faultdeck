<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="system-ui,sans-serif" font-size="14">
  <rect width="760" height="300" fill="#1e1f22" rx="8"/>
  <text x="380" y="34" fill="#e8e6e3" text-anchor="middle" font-size="18" font-weight="600">Mode A · Agent 监听(目标公网可达)</text>
  <rect x="60" y="90" width="200" height="80" rx="8" fill="#2d2e32" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="160" y="122" fill="#e8e6e3" text-anchor="middle" font-weight="600">控制端(开发机)</text>
  <text x="160" y="144" fill="#9da7b3" text-anchor="middle">faultdeck CLI</text>
  <rect x="500" y="90" width="200" height="80" rx="8" fill="#2d2e32" stroke="#3fb950" stroke-width="1.5"/>
  <text x="600" y="122" fill="#e8e6e3" text-anchor="middle" font-weight="600">Linux 被测端(公网)</text>
  <text x="600" y="144" fill="#9da7b3" text-anchor="middle">faultdeck-agent(监听)</text>
  <line x1="260" y1="118" x2="500" y2="118" stroke="#3fb950" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="500" y1="146" x2="260" y2="146" stroke="#58a6ff" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arb)"/>
  <text x="380" y="108" fill="#3fb950" text-anchor="middle">指令(注入/回滚)</text>
  <text x="380" y="168" fill="#58a6ff" text-anchor="middle">事件/日志/报告回传</text>
  <rect x="60" y="200" width="200" height="60" rx="8" fill="#2d2e32" stroke="#8b949e" stroke-width="1"/>
  <text x="160" y="226" fill="#9da7b3" text-anchor="middle">Toxiproxy / netem</text>
  <text x="160" y="246" fill="#9da7b3" text-anchor="middle">故障后端(agent 本机执行)</text>
  <line x1="600" y1="170" x2="600" y2="200" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arb)"/>
  <text x="380" y="270" fill="#6e7681" text-anchor="middle">安全:双向 token + 管理网段白名单(agent 永不注入管理流量)</text>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#3fb950"/></marker>
    <marker id="arb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#58a6ff"/></marker>
  </defs>
</svg>
