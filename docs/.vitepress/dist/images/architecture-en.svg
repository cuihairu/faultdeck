<text x="76" y="146" class="name" font-size="19" text-anchor="start">FaultDeck CLI — faultdeck-cli</text>
<text x="76" y="172" class="body" font-size="14" text-anchor="start">remote ping · inject · rollback</text>
<text x="76" y="198" class="body" font-size="14" text-anchor="start">one TCP connection per invocation</text>
<rect x="60" y="300" width="600" height="170" rx="14" fill="#eef2f7" stroke="#64748b" stroke-width="1.5"/>
<text x="76" y="336" class="name" font-size="19" text-anchor="start">faultdeck-coordinator — multi-target hub</text>
<text x="76" y="362" class="body" font-size="14" text-anchor="start">default listen 127.0.0.1:7001</text>
<text x="76" y="388" class="body" font-size="14" text-anchor="start">AgentCommand: register · heartbeat · inject · rollback</text>
<text x="76" y="414" class="body" font-size="14" text-anchor="start">fetch_report · list_agents · agent registry + routes</text>
<text x="76" y="440" class="body" font-size="14" text-anchor="start">report archive — inject/rollback queued (dispatch pending)</text>
<rect x="60" y="540" width="500" height="160" rx="14" fill="#eef2f7" stroke="#64748b" stroke-width="1.5"/>
<text x="76" y="576" class="name" font-size="19" text-anchor="start">faultdeck-agent · per target host</text>
<text x="76" y="602" class="body" font-size="14" text-anchor="start">token auth · single-active-fault state</text>
<text x="76" y="628" class="body" font-size="14" text-anchor="start">mgmt-network overlap guard</text>
<text x="76" y="654" class="body" font-size="14" text-anchor="start">validate_injection (faultdeck-core)</text>
<text x="76" y="680" class="body" font-size="14" text-anchor="start">drives tc netem + iptables firewall</text>
<rect x="60" y="780" width="500" height="170" rx="14" fill="#eef2f7" stroke="#64748b" stroke-width="1.5"/>
<text x="76" y="816" class="name" font-size="19" text-anchor="start">faultdeck-netem — tc adapter</text>
<text x="76" y="842" class="body" font-size="14" text-anchor="start">plan() → preflight tc qdisc show</text>
<text x="76" y="868" class="body" font-size="14" text-anchor="start">apply tc qdisc 100: + filter (latency / loss)</text>
<text x="76" y="894" class="body" font-size="14" text-anchor="start">rollback on failure · cleans stale qdiscs</text>
<text x="76" y="920" class="body" font-size="14" text-anchor="start">disconnects bypass tc → iptables mangle DROP</text>
<rect x="880" y="480" width="340" height="170" rx="14" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="896" y="516" class="name" font-size="19" text-anchor="start">faultdeck-core — shared model</text>
<text x="896" y="542" class="body" font-size="14" text-anchor="start">FaultSpec: latency · loss · disconnect</text>
<text x="896" y="568" class="body" font-size="14" text-anchor="start">Target · Injection</text>
<text x="896" y="594" class="body" font-size="14" text-anchor="start">validate_injection</text>
<text x="896" y="620" class="body" font-size="14" text-anchor="start">management-network overlap check</text>
<rect x="880" y="110" width="340" height="230" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="896" y="146" class="name" font-size="19" text-anchor="start">faultdeck-report</text>
<text x="896" y="172" class="body" font-size="14" text-anchor="start">Scenario · RunReport (JSON / HTML)</text>
<text x="896" y="198" class="body" font-size="14" text-anchor="start">SHA-256 scenario hash</text>
<text x="896" y="224" class="body" font-size="14" text-anchor="start">compare_runs → HistoricalDiff</text>
<text x="896" y="250" class="body" font-size="14" text-anchor="start">per-run timeline + recovery verification</text>
<rect x="60" y="1020" width="700" height="200" rx="14" fill="#ffffff" stroke="#087f5b" stroke-width="1.5"/>
<text x="76" y="1054" class="name" font-size="17" text-anchor="start">Target host (game server)</text>
<rect x="80" y="1075" width="300" height="120" rx="14" fill="#f0fdf4" stroke="#087f5b" stroke-width="1.5"/>
