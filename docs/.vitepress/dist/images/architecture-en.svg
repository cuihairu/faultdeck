<text x="96" y="1135" class="body" font-size="13" text-anchor="start">latency · packet loss</text>
<text x="96" y="1159" class="body" font-size="13" text-anchor="start">planned by netem adapter</text>
<rect x="420" y="1075" width="320" height="120" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text x="436" y="1109" class="name" font-size="17" text-anchor="start">firewall — iptables -t mangle</text>
<text x="436" y="1135" class="body" font-size="13" text-anchor="start">DROP rule = disconnect fault</text>
<text x="436" y="1159" class="body" font-size="13" text-anchor="start">applied by agent, rolled back</text>
<text x="252" y="258" class="label" font-size="14" text-anchor="start">framed JSON line</text>
<text x="252" y="512" class="label" font-size="14" text-anchor="start">TCP :7001 · newline-framed JSON</text>
<text x="252" y="748" class="label" font-size="14" text-anchor="start">FaultSpec → plan()</text>
<text x="252" y="992" class="label" font-size="14" text-anchor="start">tc qdisc 100: · latency / loss</text>
<text x="652" y="860" class="label" font-size="14" text-anchor="start">iptables -t mangle DROP (disconnect)</text>
<text x="600" y="574" class="label" font-size="14" text-anchor="start">validate_injection</text>
<text x="700" y="372" class="label" font-size="14" text-anchor="start">archive RunReport</text>
<text x="460" y="167" class="label" font-size="14" text-anchor="start">compare_runs (baseline vs run)</text>
