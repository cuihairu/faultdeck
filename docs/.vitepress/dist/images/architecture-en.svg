<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1360" viewBox="0 0 1280 1360" role="img" aria-labelledby="title desc" xml:lang="en-US">
<title id="title">FaultDeck · System Architecture</title>
<desc id="desc">FaultDeck architecture: the faultdeck CLI sends newline-framed JSON commands to the faultdeck-coordinator hub (default 127.0.0.1:7001), which keeps the agent registry and routes and archives run reports; faultdeck-agent on each target host authenticates by token, validates faults against faultdeck-core, drives the faultdeck-netem tc adapter (root qdisc 100: for latency and loss) and applies iptables mangle DROP for disconnect faults; faultdeck-report renders JSON/HTML RunReports with SHA-256 scenario hashes and compare_runs history diffs.</desc>
