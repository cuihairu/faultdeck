[workspace]
resolver = "2"
members = ["crates/core", "crates/netem", "crates/agent", "crates/cli", "crates/report", "crates/coordinator", "crates/desktop"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
ipnet = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
thiserror = "2"
